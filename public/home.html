<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>雨字 — Matrix Rain</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
  }
  .label {
    position: fixed;
    bottom: 14px;
    left: 18px;
    color: #888;
    font-family: monospace;
    font-size: 12px;
    opacity: 0.5;
    letter-spacing: 1px;
    pointer-events: none;
  }

  #enterBtn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 30px;
    border: 1.5px solid rgba(0,0,0,0.85);
    border-radius: 999px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(2px);
    color: #111;
    font-family: monospace;
    font-size: 15px;
    letter-spacing: 2px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  #enterBtn:hover {
    background: #111;
    color: #fff;
    border-color: #111;
    transform: translate(-50%, -50%) scale(1.04);
  }

  #gearBtn {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(30,30,30,0.75);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 20;
  }

  #panel {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 290px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    background: rgba(25,25,28,0.92);
    color: #eee;
    border-radius: 10px;
    padding: 14px 16px 18px;
    box-sizing: border-box;
    font-size: 12.5px;
    z-index: 10;
    display: none;
    backdrop-filter: blur(4px);
  }
  #panel.open { display: block; }
  #panel h3 {
    margin: 14px 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8fd0ff;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 4px;
  }
  #panel h3:first-of-type { margin-top: 0; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 6px 0;
  }
  .row label { flex: 1 1 auto; color: #ccc; }
  .row input[type=range] { flex: 1 1 110px; }
  .row .val {
    width: 36px;
    text-align: right;
    color: #8fd0ff;
    font-family: monospace;
    font-size: 11.5px;
  }
  .row input[type=color] {
    width: 34px;
    height: 22px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .row input[type=checkbox] { width: 16px; height: 16px; }
  #panel .closeRow {
    text-align: right;
    margin-bottom: 6px;
  }
  #panel .closeRow button {
    background: none;
    border: none;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="label">刷字 · matrix rain</div>

<a id="enterBtn" href="/" title="Entrar a la app">刷字 · Entrar</a>

<button id="gearBtn" title="Ajustes">⚙</button>
<div id="panel">
  <div class="closeRow"><button id="closeBtn">cerrar ✕</button></div>

  <h3>Tamaño</h3>
  <div class="row"><label>Tamaño base</label><input type="range" id="baseFontSize" min="12" max="48" step="1"><span class="val" id="v_baseFontSize"></span></div>
  <div class="row"><label>Escala mín. (lejos)</label><input type="range" id="minScale" min="0.3" max="1.2" step="0.05"><span class="val" id="v_minScale"></span></div>
  <div class="row"><label>Escala máx. (cerca)</label><input type="range" id="maxScale" min="1.0" max="2.5" step="0.05"><span class="val" id="v_maxScale"></span></div>
  <div class="row"><label>Espacio horizontal</label><input type="range" id="colGapFactor" min="1.0" max="2.2" step="0.05"><span class="val" id="v_colGapFactor"></span></div>
  <div class="row"><label>Espacio vertical</label><input type="range" id="lineGapFactor" min="1.0" max="1.6" step="0.02"><span class="val" id="v_lineGapFactor"></span></div>

  <h3>Velocidad</h3>
  <div class="row"><label>Mínima (lejos)</label><input type="range" id="speedMin" min="0.3" max="6" step="0.1"><span class="val" id="v_speedMin"></span></div>
  <div class="row"><label>Máxima (cerca)</label><input type="range" id="speedMax" min="3" max="18" step="0.5"><span class="val" id="v_speedMax"></span></div>

  <h3>Cola</h3>
  <div class="row"><label>Mínima (lejos)</label><input type="range" id="trailMin" min="2" max="20" step="1"><span class="val" id="v_trailMin"></span></div>
  <div class="row"><label>Máxima (cerca)</label><input type="range" id="trailMax" min="8" max="50" step="1"><span class="val" id="v_trailMax"></span></div>

  <h3>Contraste (cabeza)</h3>
  <div class="row"><label>Intensidad lejos</label><input type="range" id="headDarkFar" min="0" max="255" step="5"><span class="val" id="v_headDarkFar"></span></div>
  <div class="row"><label>Intensidad cerca</label><input type="range" id="headDarkNear" min="0" max="255" step="5"><span class="val" id="v_headDarkNear"></span></div>
  <div class="row"><label>Fusión lejos</label><input type="range" id="mergeGrayFar" min="0" max="255" step="5"><span class="val" id="v_mergeGrayFar"></span></div>
  <div class="row"><label>Fusión cerca</label><input type="range" id="mergeGrayNear" min="0" max="255" step="5"><span class="val" id="v_mergeGrayNear"></span></div>

  <h3>Textura de fondo</h3>
  <div class="row"><label>Visibilidad lejos</label><input type="range" id="bgVisFar" min="0" max="0.3" step="0.01"><span class="val" id="v_bgVisFar"></span></div>
  <div class="row"><label>Visibilidad cerca</label><input type="range" id="bgVisNear" min="0" max="0.5" step="0.01"><span class="val" id="v_bgVisNear"></span></div>

  <h3>Color</h3>
  <div class="row"><label>Fondo</label><input type="color" id="bgColor"></div>
  <div class="row"><label>Letras</label><input type="color" id="fgColor"></div>

  <h3>Orden</h3>
  <div class="row"><label>Cercanas encima</label><input type="checkbox" id="depthOrder"></div>
</div>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

const chars = "的一是不了人我在有他这中大来上国个到说们为子和你地出道也时年得就那要下以生会自着去之过家学对可她里后小么心多天而能成于然样没还最长凍京汽亦吉並佞昏予棟亍丰從場拚予扎弍京並劲呔吋於亍".split('');

// ---- parámetros controlables, con sus valores por defecto ----
const P = {
  baseFontSize: 24,
  minScale: 0.55,
  maxScale: 1.55,
  colGapFactor: 1.25,
  lineGapFactor: 1.18,
  speedMin: 1.8,
  speedMax: 8,
  trailMin: 6,
  trailMax: 24,
  headDarkFar: 150,
  headDarkNear: 0,
  mergeGrayFar: 248,
  mergeGrayNear: 165,
  bgVisFar: 0.06,
  bgVisNear: 0.28,
  bgColor: '#ffffff',
  fgColor: '#000000',
  depthOrder: true
};

function randomChar() {
  return chars[Math.floor(Math.random() * chars.length)];
}
function lerp(a, b, t) { return a + (b - a) * t; }

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

let cols, columnsData;

function makeColumn() {
  const depth = Math.random();

  const fontSize = P.baseFontSize * lerp(P.minScale, P.maxScale, depth);
  const lineGap  = fontSize * P.lineGapFactor;
  const rowsC    = Math.ceil(canvas.height / lineGap) + 2;

  const gridChars = new Array(rowsC).fill(0).map(randomChar);
  const visRange  = lerp(P.bgVisFar, P.bgVisNear, depth);
  const bgBrightness = new Array(rowsC).fill(0).map(() => 0.02 + Math.random() * visRange);

  return {
    depth,
    fontSize,
    lineGap,
    rowsC,
    gridChars,
    bgBrightness,
    headPos: Math.random() * -30,
    speed: lerp(P.speedMin, P.speedMax, depth) + Math.random() * (P.speedMax * 0.15),
    trailLen: Math.round(lerp(P.trailMin, P.trailMax, depth) + Math.random() * 6),
    headDark: Math.round(lerp(P.headDarkFar, P.headDarkNear, depth)),
    mergeGray: Math.round(lerp(P.mergeGrayFar, P.mergeGrayNear, depth))
  };
}

function setup() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colGap = P.baseFontSize * P.maxScale * P.colGapFactor;
  cols = Math.ceil(canvas.width / colGap);
  columnsData = new Array(cols).fill(0).map(makeColumn);
  setup.colGap = colGap;
}

function update(dt) {
  for (const s of columnsData) {
    s.headPos += s.speed * dt;
    if (s.headPos - s.trailLen > s.rowsC + 5) {
      const fresh = makeColumn();
      s.headPos = fresh.headPos;
      s.speed = fresh.speed;
      s.trailLen = fresh.trailLen;
    }
  }
}

function draw() {
  const fg = hexToRgb(P.fgColor);
  const bg = hexToRgb(P.bgColor);

  ctx.fillStyle = P.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textBaseline = 'top';

  const colGap = setup.colGap;
  let order = columnsData.map((s, i) => i);
  if (P.depthOrder) order.sort((a, b) => columnsData[a].depth - columnsData[b].depth);

  for (const c of order) {
    const s = columnsData[c];
    const x = c * colGap;
    ctx.font = s.fontSize + 'px monospace';

    for (let r = 0; r < s.rowsC; r++) {
      const diff = s.headPos - r;
      let g; // 0 = color de letra puro (fg), 255 = se funde con el fondo (bg)

      if (diff >= 0 && diff <= s.trailLen) {
        const t = 1 - diff / s.trailLen;
        g = t > 0.92 ? s.headDark : Math.round(lerp(s.mergeGray, s.headDark, t));
      } else {
        g = Math.round(255 - s.bgBrightness[r] * 300);
      }

      const tt = Math.min(1, Math.max(0, g / 255));
      const rr = Math.round(lerp(fg[0], bg[0], tt));
      const gg = Math.round(lerp(fg[1], bg[1], tt));
      const bb = Math.round(lerp(fg[2], bg[2], tt));
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.fillText(s.gridChars[r], x, r * s.lineGap);
    }
  }
}

let lastTime = performance.now();
function frame(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---- conectar el panel de controles ----
function bindControls() {
  for (const key of Object.keys(P)) {
    const el = document.getElementById(key);
    if (!el) continue;

    if (el.type === 'checkbox') {
      el.checked = P[key];
      el.addEventListener('change', () => { P[key] = el.checked; setup(); });
    } else if (el.type === 'color') {
      el.value = P[key];
      el.addEventListener('input', () => { P[key] = el.value; });
    } else {
      el.value = P[key];
      const out = document.getElementById('v_' + key);
      if (out) out.textContent = (+el.value).toFixed(el.step.includes('.') ? 2 : 0);
      el.addEventListener('input', () => {
        P[key] = parseFloat(el.value);
        if (out) out.textContent = P[key].toFixed(el.step.includes('.') ? 2 : 0);
        setup();
      });
    }
  }
}

const gearBtn = document.getElementById('gearBtn');
const panel = document.getElementById('panel');
const closeBtn = document.getElementById('closeBtn');
gearBtn.addEventListener('click', () => panel.classList.toggle('open'));
closeBtn.addEventListener('click', () => panel.classList.remove('open'));

bindControls();
setup();
window.addEventListener('resize', setup);
requestAnimationFrame(frame);
</script>
</body>
</html>
