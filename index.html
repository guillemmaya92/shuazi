<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-title" content="刷子"/>
  <meta name="theme-color" content="#0e1215"/>
  <link rel="manifest" href="./manifest.json"/>
  <title>刷子</title>
  <style>
    :root {
      --safe-t: env(safe-area-inset-top,    0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left,   0px);
      --safe-r: env(safe-area-inset-right,  0px);
    }
    [data-theme="dark"] {
      --bg:        #0e1215;
      --surf:      #161c21;
      --surf2:     #1d252c;
      --bdr:       rgba(255,255,255,.08);
      --txt:       #e8f0f4;
      --muted:     #8fa4b0;
      --faint:     #4a5c68;
      --red:       #d9705a;
      --red-bg:    rgba(217,112,90,.15);
      --green:     #68bf8a;
      --green-bg:  rgba(104,191,138,.14);
      --blue:      #64a0e6;
      --blue-bg:   rgba(100,160,230,.15);
      --sh:        0 28px 70px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.3);
      --tabbar:    rgba(14,18,21,.88);
      --bar-bg:    rgba(255,255,255,.18);
      --bar-act:   rgba(255,255,255,.92);
    }
    [data-theme="light"] {
      --bg:        #f0ebe4;
      --surf:      #faf6f1;
      --surf2:     #ffffff;
      --bdr:       rgba(0,0,0,.08);
      --txt:       #1c1510;
      --muted:     #7a6d63;
      --faint:     #b0a49a;
      --red:       #b04030;
      --red-bg:    rgba(176,64,48,.11);
      --green:     #3a7a56;
      --green-bg:  rgba(58,122,86,.11);
      --blue:      #2560b0;
      --blue-bg:   rgba(37,96,176,.11);
      --sh:        0 28px 70px rgba(28,21,16,.18), 0 4px 14px rgba(28,21,16,.08);
      --tabbar:    rgba(240,235,228,.92);
      --bar-bg:    rgba(0,0,0,.18);
      --bar-act:   rgba(0,0,0,.85);
    }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      width:100%; height:100%; height:100dvh;
      overflow:hidden; overscroll-behavior:none;
      -webkit-text-size-adjust:100%;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }
    body {
      font-family:-apple-system,'Helvetica Neue',sans-serif;
      background:var(--bg); color:var(--txt);
      -webkit-font-smoothing:antialiased;
    }
    button { font:inherit; color:inherit; border:none; background:none; cursor:pointer; }

    /* ── ROOT LAYOUT ── */
    .root {
      height:100dvh;
      display:grid;
      grid-template-rows: 1fr auto;
    }

    /* ── SCREENS ── */
    .screens {
      overflow:hidden; position:relative;
    }
    .screen {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      padding-top:    max(14px, var(--safe-t));
      padding-left:   max(16px, var(--safe-l));
      padding-right:  max(16px, var(--safe-r));
      padding-bottom: 8px;
      gap:10px;
      opacity:0; pointer-events:none;
      transition: opacity 220ms ease;
    }
    .screen.active { opacity:1; pointer-events:all; }

    /* ── TAB BAR ── */
    .tabbar {
      display:flex;
      background: var(--tabbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--bdr);
      padding-bottom: max(4px, var(--safe-b));
      padding-top: 2px;
    }
    .tab {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:1px; padding:4px 0;
      color:var(--faint);
      transition: color 180ms ease;
      min-height:36px;
    }
    .tab.active { color:var(--blue); }
    .tab svg { width:16px; height:16px; }
    .tab span { font-size:.52rem; font-weight:600; letter-spacing:.02em; }

    /* ══════════════════════════════
       SCREEN 1 — FLASHCARDS
    ══════════════════════════════ */
    .header {
      display:flex; align-items:center; justify-content:space-between;
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo {
      width:34px; height:34px; flex-shrink:0;
      border-radius:10px; background:var(--red-bg); border:1px solid var(--bdr);
      display:grid; place-items:center; font-size:14px; line-height:1;
      color:var(--red); padding-right:2px;
    }
    .title   { font-size:.95rem; font-weight:700; line-height:1.1; }
    .sub     { font-size:.62rem; color:var(--faint); margin-top:0px; }
    .hdr-stats { display:flex; gap:14px; align-items:center; }
    .st { text-align:center; }
    .st .v { font-size:.92rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
    .st .l { font-size:.56rem; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
    #sKnown .v  { color:var(--green); }
    #sRepaso .v { color:var(--red); }
    .icon-btn {
      width:28px; height:28px; display:grid; place-items:center;
      border-radius:50%; background:var(--surf); border:1px solid var(--bdr); color:var(--muted);
    }
    .icon-btn:active { opacity:.6; }

    /* deck */
    .deck-wrap { position:relative; flex:1; }
    .deck      { position:absolute; inset:0; }

    /* card */
    .card {
      position:absolute; inset:0; border-radius:24px;
      background:var(--surf2); border:1px solid var(--bdr);
      box-shadow:var(--sh); overflow:hidden;
      touch-action:none; user-select:none;
      display:flex; flex-direction:column;
    }
    .card::before {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 55% 30% at 80% 8%,  rgba(217,112,90,.07),transparent),
        radial-gradient(ellipse 45% 25% at 15% 92%, rgba(104,191,138,.05),transparent);
    }
    .card.stack-under { transform:scale(.97) translateY(8px); opacity:.5; z-index:0; }
    .card.top   { z-index:1; }
    .card.fly   { transition:transform 230ms cubic-bezier(0.16,1,0.3,1), opacity 200ms ease; }
    .card.snap  { transition:transform 260ms cubic-bezier(0.16,1,0.3,1), opacity 200ms ease; }

    .tint { position:absolute; inset:0; z-index:2; border-radius:inherit; pointer-events:none; opacity:0; }
    .tint-l { background:var(--red-bg); }
    .tint-r { background:var(--green-bg); }
    .chip { position:absolute; top:52px; z-index:3; padding:4px 12px; border-radius:999px; font-size:.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; opacity:0; pointer-events:none; }
    .chip-l { left:16px;  background:var(--red-bg);   color:var(--red);   }
    .chip-r { right:16px; background:var(--green-bg); color:var(--green); }

    /* story bar */
    .story-bar { position:relative; z-index:4; display:flex; gap:5px; padding:10px 14px 0; }
    .seg { flex:1; height:3px; border-radius:2px; background:var(--bar-bg); }
    .seg.active { background:var(--bar-act); }

    /* tap zones */
    .tap-zones { position:absolute; inset:0; z-index:5; display:grid; grid-template-columns:28% 1fr 28%; pointer-events:none; }
    .tz { pointer-events:auto; background:transparent; -webkit-tap-highlight-color:transparent; }

    /* card body */
    .card-body {
      position:relative; z-index:3; flex:1;
      display:flex; flex-direction:column;
      padding:10px 20px 18px; overflow:hidden;
    }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .prog { font-size:.62rem; color:var(--faint); }

    /* HSK pills */
    .hsk-pill { padding:4px 11px; border-radius:999px; font-size:.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .hsk-1 { background:rgba(104,191,138,.18); color:#68bf8a; border:1px solid rgba(104,191,138,.25); }
    .hsk-2 { background:rgba(100,160,230,.18); color:#64a0e6; border:1px solid rgba(100,160,230,.25); }
    .hsk-3 { background:rgba(217,112,90,.18);  color:#d9705a; border:1px solid rgba(217,112,90,.25); }

    /* hanzi — fills remaining space, always centred */
    .hanzi-wrap {
      flex:1; display:flex; align-items:center; justify-content:center;
    }
    .hanzi {
      font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
      font-size:130px; font-weight:400; line-height:1;
      color:var(--txt); -webkit-text-fill-color:var(--txt);
    }

    /* answer block fades in below */
    .answer-area {
      min-height:90px; display:flex; flex-direction:column;
      align-items:center; gap:6px; padding-top:6px;
    }
    .answer-block { width:100%; display:flex; flex-direction:column; align-items:center; gap:7px; animation:fadeUp 180ms ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .ans-pinyin  { font-size:1.25rem; font-weight:600; color:var(--txt); }
    .ans-meaning { font-size:.9rem; color:var(--muted); }
    .ans-example {
      margin-top:2px; background:var(--surf); border:1px solid var(--bdr);
      border-radius:14px; padding:9px 14px;
      font-size:.76rem; color:var(--muted); text-align:center; line-height:1.5; width:100%;
    }
    .ans-example span { display:block; font-size:.56rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:2px; }
    .ans-hint { font-size:.56rem; color:var(--faint); margin-top:2px; }
    .tap-hint { font-size:.56rem; color:var(--faint); text-align:center; }

    /* card bottom */
    .card-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }

    /* pages slider */
    .pages { position:absolute; inset:0; display:flex; transition:transform 280ms cubic-bezier(0.4,0,0.2,1); will-change:transform; }
    .page { min-width:100%; height:100%; display:flex; flex-direction:column; padding:10px 20px 18px; overflow:hidden; }

    /* info page */
    .page.info-page { gap:10px; overflow-y:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start; }
    .page.info-page::-webkit-scrollbar { display:none; }
    .info-row { display:grid; grid-template-columns:1fr 1fr; gap:7px; width:100%; }
    .info-cell { background:var(--surf); border:1px solid var(--bdr); border-radius:14px; padding:9px 12px; }
    .info-cell .lbl { font-size:.57rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin-bottom:2px; }
    .info-cell .val { font-size:.88rem; font-weight:600; color:var(--txt); line-height:1.3; }
    .info-cell.full { grid-column:1/-1; }
    .words-title { font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); width:100%; }
    .words-list { background:var(--surf); border:1px solid var(--bdr); border-radius:16px; overflow:hidden; width:100%; }
    .word-item { padding:9px 13px; font-size:.78rem; color:var(--muted); line-height:1.4; border-bottom:1px solid var(--bdr); display:flex; flex-direction:column; gap:1px; }
    .word-item:last-child { border-bottom:none; }
    .word-item strong { color:var(--txt); font-size:.9rem; font-family:'PingFang SC','Hiragino Sans GB',sans-serif; }
    .word-pinyin  { font-size:.7rem; color:var(--muted); }
    .word-meaning { font-size:.7rem; color:var(--faint); }

    /* done */
    .done {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; text-align:center; padding:28px;
      background:var(--surf2); border:1px solid var(--bdr); border-radius:24px; box-shadow:var(--sh);
    }
    .done-emoji { font-size:2.8rem; }
    .done h2 { font-size:1.2rem; font-weight:700; }
    .done p  { font-size:.84rem; color:var(--muted); }
    .done-pills { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:4px; }
    .pill { min-height:44px; padding:10px 16px; border-radius:999px; background:var(--surf); border:1px solid var(--bdr); font-size:.8rem; font-weight:600; }
    .pill:active { opacity:.7; transform:scale(.96); }

    /* ══════════════════════════════
       SCREEN 2 — HSK GROUPS
    ══════════════════════════════ */
    .groups-header {
      display:flex; align-items:center; justify-content:space-between;
    }
    .groups-title { font-size:1.1rem; font-weight:700; }
    .groups-sub   { font-size:.65rem; color:var(--faint); margin-top:1px; }

    .groups-scroll {
      flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
      display:flex; flex-direction:column; gap:16px;
      padding-bottom:4px;
    }
    .groups-scroll::-webkit-scrollbar { display:none; }

    .hsk-group { display:flex; flex-direction:column; gap:8px; }
    .hsk-group-header {
      display:flex; align-items:center; justify-content:space-between;
    }
    .hsk-group-label {
      display:flex; align-items:center; gap:8px;
    }
    .hsk-group-label .badge {
      padding:4px 12px; border-radius:999px;
      font-size:.65rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    }
    .hsk-group-label .count { font-size:.72rem; color:var(--faint); }
    .hsk-prog-bar {
      height:4px; background:var(--bdr); border-radius:2px; overflow:hidden; flex:1; max-width:80px;
    }
    .hsk-prog-fill { height:100%; border-radius:2px; transition:width 400ms ease; }
    .hsk-1-fill { background:#68bf8a; }
    .hsk-2-fill { background:#64a0e6; }
    .hsk-3-fill { background:#d9705a; }
    .hsk-full-bar {
      height:5px; background:var(--bdr); border-radius:3px; overflow:hidden; width:100%;
    }
    .hsk-full-bar-fill { height:100%; border-radius:3px; transition:width 400ms ease; }

    .char-grid {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:8px;
      overflow:hidden;
      transition: max-height 320ms cubic-bezier(0.4,0,0.2,1), opacity 240ms ease, margin-top 320ms ease;
      max-height: 2000px;
      opacity: 1;
      margin-top: 0;
    }
    .char-grid.collapsed {
      max-height: 0 !important;
      opacity: 0;
      margin-top: -4px;
    }
    .hsk-group-header {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hsk-group-header:active { opacity: .7; }
    .chevron {
      width:16px; height:16px; color:var(--faint); flex-shrink:0;
      transition: transform 280ms cubic-bezier(0.4,0,0.2,1);
    }
    .chevron.open { transform: rotate(180deg); }
    .char-tile {
      aspect-ratio:1;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      border-radius:14px;
      background:var(--surf); border:1px solid var(--bdr);
      position:relative; cursor:pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    .char-tile:active { transform:scale(.93); }
    .char-tile .tc {
      font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
      font-size:26px; line-height:1; color:var(--txt);
      -webkit-text-fill-color:var(--txt);
    }
    .char-tile .tp { font-size:.52rem; color:var(--faint); margin-top:2px; }
    .char-tile.known {
      background:var(--green-bg); border-color:rgba(104,191,138,.3);
    }
    .char-tile.known .tc { color:var(--green); -webkit-text-fill-color:var(--green); }
    .char-tile.known .tp { color:var(--green); opacity:.6; }
    .char-tile.repaso {
      background:var(--red-bg); border-color:rgba(217,112,90,.3);
    }
    .char-tile.repaso .tc { color:var(--red); -webkit-text-fill-color:var(--red); }
    .char-tile.repaso .tp { color:var(--red); opacity:.6; }
    .char-tile .toggle-btn { display:none; }

    /* char detail modal */
    .modal-backdrop {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
      display:none; align-items:flex-end; justify-content:center;
      padding:0;
    }
    .modal-backdrop.open { display:flex; }
    .modal {
      width:100%; max-width:480px;
      background:var(--surf2); border:1px solid var(--bdr);
      border-radius:24px 24px 0 0;
      box-shadow:var(--sh);
      padding:20px 20px;
      padding-bottom:max(28px, var(--safe-b));
      display:flex; flex-direction:column; gap:14px;
      max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      animation:slideUp 220ms cubic-bezier(0.16,1,0.3,1);
    }
    .modal::-webkit-scrollbar { display:none; }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .modal-handle { width:36px; height:4px; border-radius:2px; background:var(--bdr); margin:0 auto 4px; }
    .modal-char {
      font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
      font-size:72px; line-height:1; text-align:center;
      color:var(--txt); -webkit-text-fill-color:var(--txt);
    }
    .modal-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .modal-cell { background:var(--surf); border:1px solid var(--bdr); border-radius:12px; padding:9px 12px; }
    .modal-cell .lbl { font-size:.57rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin-bottom:2px; }
    .modal-cell .val { font-size:.88rem; font-weight:600; color:var(--txt); line-height:1.3; }
    .modal-cell.full { grid-column:1/-1; }
    .modal-words-title { font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
    .modal-words { background:var(--surf); border:1px solid var(--bdr); border-radius:14px; overflow:hidden; }
    .modal-words .word-item { padding:9px 13px; font-size:.78rem; color:var(--muted); line-height:1.4; border-bottom:1px solid var(--bdr); display:flex; flex-direction:column; gap:1px; }
    .modal-words .word-item:last-child { border-bottom:none; }
    .modal-words .word-item strong { color:var(--txt); font-size:.9rem; font-family:'PingFang SC','Hiragino Sans GB',sans-serif; }

    /* ── SPEAK BUTTON ── */
    .speak-btn {
      display:inline-flex; align-items:center; justify-content:center; gap:5px;
      width:30px; height:30px; padding:0; border-radius:50%;
      background:var(--blue-bg); border:1px solid rgba(100,160,230,.25);
      color:var(--blue);
      cursor:pointer; transition:opacity 140ms ease, transform 120ms ease;
      flex-shrink:0;
    }
    .speak-btn:active { opacity:.65; transform:scale(.94); }
    .speak-btn svg { width:13px; height:13px; flex-shrink:0; }
    .speak-btn.speaking { animation:speakPulse 600ms ease infinite alternate; }
    @keyframes speakPulse { from{opacity:1} to{opacity:.5} }

    /* Modal speak */
    .modal-char-row { display:flex; align-items:center; justify-content:center; gap:12px; }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
<div class="root">

  <!-- SCREENS -->
  <div class="screens">

    <!-- ── SCREEN 1: FLASHCARDS ── -->
    <div class="screen active" id="screen-cards">
      <header class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true">刷子</div>
          <div>
            <div class="title">shuazi</div>
            <div class="sub">HSK 1–3 · 刷子</div>
          </div>
        </div>
        <div class="hdr-stats">
          <div class="st" id="sRest"><div class="v" id="vRest">50</div><div class="l">Left</div></div>
          <div class="st" id="sKnown"><div class="v" id="vKnown">0</div><div class="l">Known</div></div>
          <div class="st" id="sRepaso"><div class="v" id="vRepaso">0</div><div class="l">Review</div></div>
          <button class="icon-btn" id="themeBtn" aria-label="Theme">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>
      <div class="deck-wrap"><div class="deck" id="deck"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.6rem;color:var(--faint);padding:0 4px">
        <span>← Don't know</span><span>Tap · swipe</span><span>I know it →</span>
      </div>
    </div>

    <!-- ── SCREEN 2: GRUPOS HSK ── -->
    <div class="screen" id="screen-groups">
      <div class="groups-header">
        <div>
          <div class="groups-title">HSK Groups</div>
          <div class="groups-sub">Tap a character to see details</div>
        </div>
        <button class="icon-btn" id="themeBtnG" aria-label="Theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="groups-scroll" id="groups-scroll"></div>
    </div>

  </div>

  <!-- TAB BAR -->
  <nav class="tabbar" style="min-height:52px">
    <button class="tab active" id="tab-cards" aria-label="Flashcards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">

const STORE_KEY = 'shuazi-v1';
function saveState(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      known:     [...known],
      unknown:   [...unknown],
      deckChars: deck.map(c=>c.char)
    }));
  } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}

const vKnown  = document.getElementById('vKnown');
const vRepaso = document.getElementById('vRepaso');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]; } }
function stats(){
  vRest.textContent   = deck.length;
  vKnown.textContent  = known.size;
  vRepaso.textContent = unknown.size;
  saveState();
  renderGroups();
}

/* ── WORD PARSER ── */
function parseWord(w){
  const parts=w.split(' · ');
  const first=parts[0].trim();
  const m=first.match(/^([一-鿿㐀-䶿]+)\s*(.*)$/);
  return { hanzi:m?m[1]:first, pinyin:m?m[2].trim():'', meaning:parts.slice(1).join(' · ') };
}

/* ══════════════════════
   SPEAK HANZI
══════════════════════ */
function speakHanzi(text, btn){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 0.85;
  // Prefer a zh-CN voice if available
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v=>v.lang.startsWith('zh'));
  if(zhVoice) utter.voice = zhVoice;
  if(btn){ btn.classList.add('speaking'); utter.onend = ()=>btn.classList.remove('speaking'); }
  window.speechSynthesis.speak(utter);
}
// Ensure voices are loaded (needed for some browsers)
window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged = ()=>window.speechSynthesis.getVoices();

const PAGES=2;

function makeCard(card,isStack){
  const el=document.createElement('article');

  }).join('');

  el.innerHTML=`
    <div class="tint tint-l"></div>
    <div class="tint tint-r"></div>
    <div class="chip chip-l">Review</div>
    <div class="chip chip-r">Known</div>
    <div class="story-bar">
      <div class="seg active" data-i="0"></div>
      <div class="seg"        data-i="1"></div>
    </div>
    <div class="tap-zones">
      <button class="tz tz-left"   tabindex="-1"></button>
      <button class="tz tz-center" tabindex="-1"></button>
      <button class="tz tz-right"  tabindex="-1"></button>
    </div>
    <div class="pages" id="pages">
      <div class="page" style="justify-content:space-between;">
        <div class="card-top">
          <span class="prog"></span>
        </div>
        <div class="hanzi-wrap"><div class="hanzi">${card.char}</div></div>
        <div class="answer-area" id="aa"></div>
        <div class="card-bottom">
          <span class="tap-hint">Tap center to reveal</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="speak-btn speak-main" aria-label="Pronounce">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <span class="hsk-pill hsk-${card.hsk}">HSK ${card.hsk}</span>
          </div>
        </div>
      </div>
      <div class="page info-page">
        <div class="hanzi-wrap" style="flex:0;padding:10px 0 4px;gap:12px">
          <div class="hanzi" style="font-size:80px">${card.char}</div>
          <button class="speak-btn speak-info" aria-label="Pronounce">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
        </div>
        <div class="info-row">
          <div class="info-cell"><div class="lbl">Pinyin</div><div class="val">${card.pinyin}</div></div>
          <div class="info-cell"><div class="lbl">Level</div><div class="val"><span class="hsk-pill hsk-${card.hsk}">HSK ${card.hsk}</span></div></div>
          <div class="info-cell full"><div class="lbl">Meaning</div><div class="val">${card.meaning}</div></div>
        </div>
        <div class="words-title">Compound words</div>
        <div class="words-list">${wordsHTML}</div>
      </div>
    </div>
  `;

  const pages  = el.querySelector('#pages');

  const tzL    = el.querySelector('.tz-left');
  const tzC    = el.querySelector('.tz-center');
  const tzR    = el.querySelector('.tz-right');

  function goPage(n){
    el.dataset.page=String(n);
    pages.style.transform=`translateX(-${n*100}%)`;
    segs.forEach((s,i)=>s.classList.toggle('active',i===n));
  }

  tzL.addEventListener('click',e=>{ e.stopPropagation(); const c=+el.dataset.page; if(c>0) goPage(c-1); });
  tzR.addEventListener('click',e=>{ e.stopPropagation(); const c=+el.dataset.page; if(c<PAGES-1) goPage(c+1); });
  tzC.addEventListener('click',e=>{
    e.stopPropagation();
    if(+el.dataset.page!==0) return;
    if(el.dataset.answer==='1'){
      el.dataset.answer='0'; aa.innerHTML='';
    } else {
      el.dataset.answer='1';

        <div class="ans-pinyin">${card.pinyin}</div>

/* deck = cartas pendientes (no conocidas), orden aleatorio.
   Al marcar como conocida se elimina; al marcar repasar se mueve al final
   en posición aleatoria para que no salga siempre la misma. */

function buildDeck(src){
  // filtra ya conocidas y baraja
  const cards = src.filter(c=>!known.has(c.char));
  shuffle(cards);
  return cards;
}

function render(){
  deckEl.innerHTML=''; stats();
  if(deck.length===0){ showDone(); return; }
  if(deck.length>1) deckEl.appendChild(makeCard(deck[1],true));
  deckEl.appendChild(makeCard(deck[0],false));
}

function classify(isKnown){
  if(deck.length===0) return;
  const top=deckEl.querySelector('.card.top'); if(!top) return;
  top.classList.add('fly');
  top.style.transform=`translateX(${isKnown?'140%':'-140%'}) rotate(${isKnown?16:-16}deg)`;
  top.style.opacity='0';
  const card=deck[0];
  deck.shift(); // quita la carta actual
  if(isKnown){
    known.add(card.char);
    unknown.delete(card.char);
    // ya no está en el deck
  } else {
    unknown.add(card.char);
    known.delete(card.char);
    // la reinserta en posición aleatoria (no la primera) para variedad
    const pos = deck.length>1 ? 1+Math.floor(Math.random()*deck.length) : deck.length;
    deck.splice(pos, 0, card);
  }
  setTimeout(render, 210);
}

function showDone(){
  const el=document.createElement('div'); el.className='done';
  el.innerHTML=`
    <div class="done-emoji">🎉</div>
    <h2>Session complete!</h2>
    <p>Known: <strong style="color:var(--green)">${known.size}</strong> &nbsp;·&nbsp; Review: <strong style="color:var(--red)">${unknown.size}</strong></p>
    <div class="done-pills">
      <button class="pill" id="pW">Review hard ones</button>
      <button class="pill" id="pA">Reset all</button>
    </div>`;
  deckEl.appendChild(el);
  el.querySelector('#pW').onclick=()=>{ deck=buildDeck(CARDS); render(); };
  el.querySelector('#pA').onclick=()=>init(CARDS, true);
}

function attachDrag(cardEl){
  const tl=cardEl.querySelector('.tint-l'),tr=cardEl.querySelector('.tint-r');
  const cl=cardEl.querySelector('.chip-l'),cr=cardEl.querySelector('.chip-r');
  let sx=0,sy=0,dx=0,active=false,locked=false;
  function start(x,y){ sx=x;sy=y;dx=0;active=true;locked=false;cardEl.classList.remove('fly','snap'); }
  function move(x,y){
    if(!active||locked)return;
    dx=x-sx; const dy=y-sy;
    if(Math.abs(dy)>Math.abs(dx)+10&&Math.abs(dx)<15){locked=true;active=false;snap();return;}
    if(Math.abs(dx)<5)return;
    cardEl.style.transform=`translateX(${dx}px) rotate(${dx*0.05}deg)`;
    cardEl.style.opacity=String(Math.max(.7,1-Math.abs(dx)/360));
    const a=Math.min(1,Math.abs(dx)/120);
    tl.style.opacity=dx<0?String(a*.85):'0'; tr.style.opacity=dx>0?String(a*.85):'0';
    cl.style.opacity=dx<-50?'1':'0'; cr.style.opacity=dx>50?'1':'0';
  }
  function end(){ if(!active)return; active=false; if(dx>100)classify(true); else if(dx<-100)classify(false); else snap(); }
  function snap(){
    cardEl.classList.add('snap');
    cardEl.style.transform=''; cardEl.style.opacity='';
    tl.style.opacity=tr.style.opacity='0'; cl.style.opacity=cr.style.opacity='0';
  }
  cardEl.addEventListener('pointerdown',e=>{start(e.clientX,e.clientY);cardEl.setPointerCapture(e.pointerId);});
  cardEl.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
  cardEl.addEventListener('pointerup',()=>end());
  cardEl.addEventListener('pointercancel',()=>{active=false;snap();});
}

/* ══════════════════════
   GROUPS SCREEN
══════════════════════ */
const collapsedGroups = new Set();

function renderGroups(){
  const container=document.getElementById('groups-scroll');
  const levels=[1,2,3];
  container.innerHTML='';
  levels.forEach(hsk=>{
    const group=CARDS.filter(c=>c.hsk===hsk);
    const knownCount=group.filter(c=>known.has(c.char)).length;
    const pct=group.length?Math.round(knownCount/group.length*100):0;

    const colors={1:'hsk-1',2:'hsk-2',3:'hsk-3'};
    const fillClass={1:'hsk-1-fill',2:'hsk-2-fill',3:'hsk-3-fill'};
    const isCollapsed = collapsedGroups.has(hsk);

    const div=document.createElement('div');
    div.className='hsk-group';
    div.innerHTML=`
      <div class="hsk-group-header">
        <div class="hsk-group-label">
          <span class="badge ${colors[hsk]}">HSK ${hsk}</span>
          <span class="count">${knownCount}/${group.length} known</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="hsk-prog-bar"><div class="hsk-prog-fill ${fillClass[hsk]}" style="width:${pct}%"></div></div>
          <svg class="chevron ${isCollapsed?'':'open'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="hsk-full-bar"><div class="hsk-full-bar-fill ${fillClass[hsk]}" style="width:${pct}%"></div></div>
      <div class="char-grid ${isCollapsed?'collapsed':''}" id="grid-${hsk}"></div>
    `;
    container.appendChild(div);

    const header = div.querySelector('.hsk-group-header');
    const grid   = div.querySelector(`#grid-${hsk}`);
    const chev   = div.querySelector('.chevron');

    header.addEventListener('click', ()=>{
      if(collapsedGroups.has(hsk)){ collapsedGroups.delete(hsk); grid.classList.remove('collapsed'); chev.classList.add('open'); }
      else { collapsedGroups.add(hsk); grid.classList.add('collapsed'); chev.classList.remove('open'); }
    });

    group.forEach(card=>{
      const tile=document.createElement('button');
      const isKnown = known.has(card.char);
      const isRepaso = unknown.has(card.char);
      tile.className='char-tile'+(isKnown?' known':isRepaso?' repaso':'');
      tile.innerHTML=`
        <div class="tc">${card.char}</div>
        <div class="tp">${card.pinyin}</div>
        <div class="toggle-btn">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2,6 5,9 10,3"/>
          </svg>
        </div>`;

      // long-press logic
      let pressTimer=null;
      function startPress(){
        pressTimer=setTimeout(()=>{
          pressTimer=null;
          if(known.has(card.char)){
            known.delete(card.char); unknown.delete(card.char);
            tile.classList.remove('known');
          } else {
            known.add(card.char); unknown.delete(card.char);
            tile.classList.remove('repaso');
            tile.classList.add('known');
            deck=deck.filter(c=>c.char!==card.char);
          }
          saveState();
          const newKnownCount=group.filter(c=>known.has(c.char)).length;
          const newPct=group.length?Math.round(newKnownCount/group.length*100):0;
          div.querySelector('.count').textContent=`${newKnownCount}/${group.length} known`;
          div.querySelector('.hsk-prog-fill').style.width=newPct+'%';
          vKnown.textContent=known.size;
          vRepaso.textContent=unknown.size;
          vRest.textContent=deck.length;
          if(navigator.vibrate) navigator.vibrate(30);
        }, 450);
      }
      function cancelPress(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }

      tile.addEventListener('pointerdown', e=>{ e.stopPropagation(); startPress(); });
      tile.addEventListener('pointerup',   ()=>{ if(pressTimer){ cancelPress(); openModal(card); } });
      tile.addEventListener('pointercancel', cancelPress);
      tile.addEventListener('pointermove', e=>{ if(Math.abs(e.movementX)>6||Math.abs(e.movementY)>6) cancelPress(); });
      tile.addEventListener('contextmenu', e=>e.preventDefault());
      grid.appendChild(tile);
    });
  });
}

const backdrop=document.getElementById('modal-backdrop');
const modalChar=document.getElementById('modal-char');
const modalMeta=document.getElementById('modal-meta');

modalSpeakBtn.addEventListener('click', e=>{
  e.stopPropagation();
  speakHanzi(modalChar.textContent, modalSpeakBtn);
});

function openModal(card){
  modalChar.textContent=card.char;
  modalMeta.innerHTML=`
    <div class="modal-cell"><div class="lbl">Pinyin</div><div class="val">${card.pinyin}</div></div>
    <div class="modal-cell"><div class="lbl">Level</div><div class="val"><span class="hsk-pill hsk-${card.hsk}">HSK ${card.hsk}</span></div></div>
    <div class="modal-cell full"><div class="lbl">Meaning</div><div class="val">${card.meaning}</div></div>
    <div class="modal-cell full"><div class="lbl">Example</div><div class="val">${card.example}</div></div>
  `;
  modalWords.innerHTML=card.words.map(w=>{
    const p=parseWord(w);
    return `<div class="word-item"><strong>${p.hanzi}</strong><span class="word-pinyin">${p.pinyin}</span><span class="word-meaning">${p.meaning}</span></div>`;
  }).join('');
  backdrop.classList.add('open');
}
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('open'); });

/* ══════════════════════
   TABS
══════════════════════ */
const tabCards  = document.getElementById('tab-cards');
const tabGroups = document.getElementById('tab-groups');
const scrCards  = document.getElementById('screen-cards');
const scrGroups = document.getElementById('screen-groups');

function showTab(tab){
  [scrCards,scrGroups].forEach(s=>s.classList.remove('active'));
  [tabCards,tabGroups].forEach(t=>t.classList.remove('active'));
  if(tab==='cards'){ scrCards.classList.add('active'); tabCards.classList.add('active'); }
  else { scrGroups.classList.add('active'); tabGroups.classList.add('active'); renderGroups(); }
}
tabCards.onclick=()=>showTab('cards');
tabGroups.onclick=()=>showTab('groups');

function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('shuazi-theme', t); }catch(e){}
  const icon = t==='dark'
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  document.getElementById('themeBtn').innerHTML=icon;
  document.getElementById('themeBtnG').innerHTML=icon;
}
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
document.getElementById('themeBtnG').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* keyboard */
document.addEventListener('keydown',e=>{
  const top=deckEl.querySelector('.card.top'); if(!top) return;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') classify(true);
  else if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') classify(false);
  else if(e.key===' '){ e.preventDefault(); top.querySelector('.tz-center')?.click(); }
  else if(e.key==='i') top.querySelector('.tz-right')?.click();
});

if('serviceWorker'in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>null));

function init(src, forceNew){
  if(forceNew){ known=new Set(); unknown=new Set(); }
  const saved = !forceNew && loadState();
  if(saved && src===CARDS && saved.deckChars && saved.deckChars.length){
    const charMap = Object.fromEntries(CARDS.map(c=>[c.char,c]));
    deck    = saved.deckChars.map(ch=>charMap[ch]).filter(Boolean);
    known   = new Set(saved.known   || []);
    unknown = new Set(saved.unknown || []);
  } else {
    deck = buildDeck(src);
  }
  render();
}

/* restore theme */
(()=>{
  try {
    const t = localStorage.getItem('shuazi-theme');
    if(t) setTheme(t);
  } catch(e){}
})();

init(CARDS);
renderGroups();
